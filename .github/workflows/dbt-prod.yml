name: dbt prod + Omni refresh

on:
  push:
    branches: [main]

jobs:
  prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: my_db
      DBT_PROFILES_DIR: .
      OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL || 'https://andrewbarnish.omniapp.co' }}
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      OMNI_CONNECTION_ID: ${{ vars.OMNI_CONNECTION_ID || '51e3303e-1e8a-4752-82f9-419eed9b4cba' }}
      OMNI_MODEL_ID: ${{ vars.OMNI_MODEL_ID || 'aa9824df-0ccd-4a92-8954-d56203363e48' }}
      OMNI_GIT_TOKEN: ${{ secrets.OMNI_GIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: dbt build (prod / main schema)
        run: dbt build --target prod --profiles-dir .

      - name: Refresh Omni model
        id: omni
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" || echo '[]')"
          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.[0].head.ref // empty')"
          PR="$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty')"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            python scripts/omni_preview.py refresh-prod --git-branch "$BRANCH" --pr-number "$PR"
          elif [ -n "$BRANCH" ]; then
            python scripts/omni_preview.py refresh-prod --git-branch "$BRANCH"
          else
            echo "No merged PR branch found; refresh-prod needs an Omni branch when branch-based refresh is on"
            python scripts/omni_preview.py refresh-prod
          fi

      - name: Drop CI schema and Omni dbt env
        if: success() && steps.omni.outputs.pr != ''
        run: |
          python scripts/omni_preview.py cleanup \
            --pr-number "${{ steps.omni.outputs.pr }}" \
            --git-branch "${{ steps.omni.outputs.branch }}"
