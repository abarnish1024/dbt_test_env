name: Omni preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: omni-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'omni-autofix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: my_db
      DBT_SCHEMA: dbt_pr_${{ github.event.pull_request.number }}
      DBT_PROFILES_DIR: .
      OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL || 'https://andrewbarnish.omniapp.co' }}
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      OMNI_CONNECTION_ID: ${{ vars.OMNI_CONNECTION_ID || '51e3303e-1e8a-4752-82f9-419eed9b4cba' }}
      OMNI_MODEL_ID: ${{ vars.OMNI_MODEL_ID || 'aa9824df-0ccd-4a92-8954-d56203363e48' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OMNI_GIT_TOKEN: ${{ secrets.OMNI_GIT_TOKEN }}
      OMNI_AUTOFIX: ${{ contains(github.event.pull_request.labels.*.name, 'omni-autofix') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: dbt build (CI schema)
        run: dbt build --target ci --profiles-dir .

      - name: Create Omni preview environment
        run: |
          extra=""
          if [ "${OMNI_AUTOFIX}" = "true" ]; then
            extra="--autofix"
          fi
          python scripts/omni_preview.py preview \
            --pr-number "${{ github.event.pull_request.number }}" \
            --git-branch "${{ github.head_ref }}" \
            ${extra}
